<th [class.sortable]="sortable()" (click)="toggleSort()">
    {{ name() }}

    @if (sortable()) {
        <span class="sort-icon">
            @if (!isSorted()) {
                ↕
            } @else {
                @if (sortDirection() === Direction.asc) {
                    ↑
                } @else {
                    ↓
                }
            }
        </span>
    }
</th>
