<div class="container">
  <div class="container">
    <h1>Grid Component Demo</h1>
    
    <t-grid 
      [data]="myData"
      [sortable]="true"
      [pageSize]="pageSize()"
      (sortChange)="onSortChange($event)"
      (paginationChange)="onPaginationChange($event)">
      
      <t-column 
        [name]="'First Name'"
        [property]="'firstName'"
        [sortable]="false">
      </t-column>
      
      <t-column 
        [name]="'Last Name'"
        [property]="'lastName'"
        [sortable]="true">
      </t-column>
      
      <t-column 
        [name]="'Email'"
        [property]="'email'"
        [sortable]="true">
      </t-column>
      
      <t-column 
        [name]="'Age'"
        [property]="'age'"
        [sortable]="true">
      </t-column>
    </t-grid>
    
  </div>
  <h1>Progress indicator controls</h1>
  <div class="controls-container">

    <div class="progress-control">
      <label for="progress">Progress</label>
      <span>{{progress()}}%</span>
      <input [(ngModel)]="progress" type="range" name="progress" min="0" max="100"/>
    </div>
    
    <div class="progress-control">
      <label for="radius">Radius</label>
      <span>{{radius()}}px</span>
      <input [(ngModel)]="radius" type="range" name="radius" min="50" max="150"/>
    </div>
    
    <div class="progress-control">
      <label for="color">Color</label>
      {{color()}}
      <input [(ngModel)]="color" type="color" name="color"/>
    </div>
  </div>

  <t-progress [radius]="radius()" [progress]="progress()" [color]="color()"></t-progress>
</div>


<router-outlet />
