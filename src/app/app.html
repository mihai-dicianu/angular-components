<div class="container">
    <h1>Table Demo</h1>
    
    <t-grid 
      [data]="myData"
      [sortable]="true"
      [pageSize]="pageSize()"
      (sortChange)="onSortChange($event)"
      (paginationChange)="onPaginationChange($event)">
      
      <t-column 
        [name]="'ID'"
        [property]="'id'"
        [sortable]="true">
      </t-column>
      
      <t-column 
        [name]="'First Name'"
        [property]="'firstName'"
        [sortable]="false">
      </t-column>
      
      <t-column 
        [name]="'Last Name'"
        [property]="'lastName'"
        [sortable]="true">
      </t-column>
      
      <t-column 
        [name]="'Email'"
        [property]="'email'"
        [sortable]="true">
      </t-column>
      
      <t-column 
        [name]="'Age'"
        [property]="'age'"
        [sortable]="true">
      </t-column>
    </t-grid>
    
  <div class="controls-container">
    <h1>Progress indicator demo</h1>

    <div class="progress-control">
      <label for="progress">Progress</label>
      <span>{{progress()}}%</span>
      <input [(ngModel)]="progress" type="range" name="progress" id="progress" min="-10" max="100" list="progresslist"/>
      <datalist id="progresslist">
        <option>0</option>
        <option>25</option>
        <option>50</option>
        <option>75</option>
        <option>100</option>
      </datalist>
    </div>
    
    <div class="progress-control">
      <label for="radius">Radius</label>
      <span>{{radius()}}px</span>
      <input [(ngModel)]="radius" type="range" name="radius" id="radius" min="20" max="100" list="radiuslist"/>
      <datalist id="radiuslist">
        <option>50</option>
      </datalist>
    </div>
    
    <div class="progress-control">
      <label for="color">Color</label>
      {{color()}}
      <input [(ngModel)]="color" type="color" name="color" id="color"/>
    </div>

    <t-progress [radius]="radius()" [progress]="progress()" [color]="color()" (complete)="onProgressComplete()"></t-progress>
  </div>

</div>


<router-outlet />
